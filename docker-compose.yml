services:
  # ==========================================
  # Service 1: PostgreSQL Database
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: family-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_expense_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      # Named volume: persists all database records on your host machine
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Maps port 5433 on your PC to port 5432 inside the container
      # (Avoids conflict if your PC has local PostgreSQL on 5432)
      - "5433:5432"
    networks:
      - family-finance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-family_expense_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Service 2: Node.js / Express Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-finance-backend
    restart: unless-stopped
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      NODE_ENV: production
      PORT: 5000
      # Uses Docker internal DNS name 'db' instead of 'localhost'
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-family_expense_tracker}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_production_change_me}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - family-finance-network
    # Automatically execute SQL migrations before starting the Express server
    command: sh -c "node dist/scripts/migrate.js && node dist/server.js"

  # ==========================================
  # Service 3: React / Vite / Nginx Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: family-finance-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - family-finance-network

# ==========================================
# Named Volumes (Data Persistence)
# ==========================================
volumes:
  postgres_data:
    driver: local

# ==========================================
# Virtual Network (Internal DNS & Isolation)
# ==========================================
networks:
  family-finance-network:
    driver: bridge
